<html lang="en" class="dar">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="">
 
<div class="flex justify-center min-h-screen bg-gray-100 dark:bg-gray-900 p-3">  
    <div class="container shadow-xl rounded-lg sm:mt-40 mt-24 my-auto max-w-md border-2 border-gray-200 p-3 dark:text-gray-100 dark:bg-gray-800 bg-white">
     
      <div class="text-center my-6">
        <h1 class="text-3xl font-semibold text-gray-700 dark:text-gray-100">Sign in</h1>
        <p class="text-gray-500 dark:text-gray-100">Sign in to access your account</p>
      </div>
      
      <div class="m-6">
        <form class="mb-4">
          <div class="mb-6">
            <label for="email" class="block mb-2 text-sm text-gray-600 dark:text-gray-400">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Your email address" class="w-full px-3 py-2 shadow placeholder-gray-300 border border-gray-300 rounded-md  dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 " />
          </div>
          <div class="mb-6">
            <div class="flex justify-between mb-2">
              <label for="password" class="text-sm text-gray-600 dark:text-gray-400">Password</label>
              <a href="#!" class="text-sm text-gray-400 focus:outline-none focus:text-indigo-500 hover:text-indigo-500 dark:hover:text-indigo-300">Forgot password?</a>
            </div>
            <input type="password" name="password" id="password" placeholder="Your password" class="w-full px-3 py-2 placeholder-gray-300 border border-gray-300 rounded-md shadow dark:bg-gray-700 dark:text-white dark:placeholder-gray-500 dark:border-gray-600 " />
          </div>
          <div class="mb-6">
            <button type="button" class="w-full px-3 py-4 text-white bg-indigo-500 rounded-md hover:bg-indigo-600  duration-100 ease-in-out">Sign in</button>
          </div>
          <p class="text-sm text-center text-gray-400">
            Don't have an account yet? 
            <a href="#!" class="font-semibold text-indigo-500 focus:text-indigo-600 focus:outline-none focus:underline">Sign up</a>.
          </p>
        </form>

        <div class="flex flex-row justify-center mb-8">
          <span class="absolute bg-white dark:bg-gray-800 px-4 text-gray-500">or sign-in with</span>
          <div class="w-full bg-gray-200 mt-3 h-px"></div>
        </div>
        
      
      </div>
    </div>
  </div>  
</body>
</html>
