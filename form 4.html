<html lang="en" class="dar">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body class=" bg-gray-200 dark:bg-gray-900 dark:text-gray-100">
    
    <div class="container mx-auto">
        <div class="flex justify-center px-6 my-12">
       
            <div class="w-full xl:w-3/4 lg:w-11/12 justify-center mx-auto flex">
           
               

                <div class="w-full lg:w-5/12 bg-white p-5 shadow-xl dark:bg-gray-800 rounded-lg ">
                    <h1 class="pt-2 mb-2 text-4xl font-semibold font-sans text-center">Register Now!</h1>
                    <form class="px-8 pt-6 pb-8 mb-4 bg-gray-100 rounded dark:bg-gray-700 dark:bg-opacity-60 dark:text-gray-100">


                        <div class="mb-4 md:flex md:justify-between">
                            <div class="mb-4 md:mr-2 md:mb-0">
                                <label class="block mb-2 text-sm font-bold font-sans dark:text-gray-100 text-gray-700" for="firstName"> First Name</label>
                                <input class="w-full px-6 py-2 text-sm placeholder:font-sans text-gray-700 border rounded shadow " id="firstName"type="text"placeholder="First Name"/>
                            </div>
                            <div class="md:ml-2">
                                <label class="block mb-2 text-sm font-sans font-bold dark:text-gray-100 text-gray-700">Last Name</label>
                                <input
                                    class="w-full px-6 py-2 text-sm font-sans shadow leading-tight text-gray-700 border rounded  " id="lastName" type="text" placeholder="Last Name"/>
                            </div>
                        </div>


                        <div class="mb-4 md:flex font-sans md:justify-between">
                            <div class="mb-4 md:mr-2 md:mb-0">
                                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-100" for="Email">Email</label>
                                <input class="w-full px-3 py-2 mb-3 text-sm shadow leading-tight text-gray-700 border rounded " id="Email" type="email" placeholder="Mail id"/>
                            </div>
                            <div class="md:ml-2">
                                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-100" for="birthday">Birthday</label>
                                <input class="w-full px-5 py-2 mb-3 text-sm shadow leading-tight text-gray-700 border rounded  " id="birthday" type="date" placeholder="Dob "/>
                            </div>
                        </div>


                        <div class="mb-4 md:flex font-sans md:justify-between">
                            <div class="mb-4 md:mr-2 md:mb-0">
                                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-100" for="password">Password</label>
                                <input class="w-full px-3 py-2 mb-3 text-sm shadow leading-tight text-gray-700 border rounded " id="password" type="password" placeholder="Password"/>
                            </div>
                            <div class="md:ml-2">
                                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-100" for="c_password">Confirm Password</label>
                                <input class="w-full px-3 py-2 mb-3 text-sm shadow leading-tight text-gray-700 border rounded  " id="c_password" type="password" placeholder="Password"/>
                            </div>
                        </div>


                        <div class="mb-6 text-center font-sans">
                            <button class="w-full px-4 py-2 text-sm md:text-lg font-bold text-white bg-blue-500 rounded-full hover:bg-blue-700 " type="button">Register Account</button>
                        </div>

                        <hr class="mb-6 border-t" />

                        <div class="text-center">
                            <a class="inline-block text-sm text-blue-500 dark:text-gray-200 align-baseline hover:text-blue-800" href=""> Forgot Password?</a>
                        </div>
                        
                        <div class="text-center">
                            <a class="inline-block text-sm text-blue-500 dark:text-gray-200 align-baseline hover:text-blue-800" href=" ">Already have an account? Login!</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
